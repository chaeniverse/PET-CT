# Gemini Code Assist(GitHub 앱) 설정. 리뷰 규칙은 같은 폴더의 styleguide.md
# 키 목록: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true
ignore_patterns:
  - "env/*.lock.txt"
